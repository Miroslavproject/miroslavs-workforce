<style>
/* Layout: ľavo zarovnaná stránka, skilly ako riadky katalógu so súborovou štítkou (.skill) ako hlavným motívom. */
:root {
  --bg: #F6F1EA;
  --surface: #FFFFFF;
  --fg: #261C15;
  --muted: #6B5A4E;
  --line: #E3D8CC;
  --accent: #B8470F;
  --accent-ink: #FFFFFF;
  --chip: #EFE3D5;
  --shadow: rgba(38, 28, 21, 0.12);
  --font-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17120E; --surface: #211A15; --fg: #F3EBE3; --muted: #BBA999;
    --line: #3A2E25; --accent: #F28B50; --accent-ink: #231207; --chip: #2B2119; --shadow: rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17120E; --surface: #211A15; --fg: #F3EBE3; --muted: #BBA999;
  --line: #3A2E25; --accent: #F28B50; --accent-ink: #231207; --chip: #2B2119; --shadow: rgba(0, 0, 0, 0.45);
  color-scheme: dark;
}
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  padding-inline: clamp(16px, 4vw, 32px);
  padding-block: 0 48px;
}
.salebar { position: sticky; top: 0; z-index: 50; margin-inline: calc(-1 * clamp(16px, 4vw, 32px)); padding: 10px 16px; background: var(--accent); color: var(--accent-ink); text-align: center; font-family: var(--font-mono); font-size: 0.85rem; font-weight: 500; letter-spacing: 0.02em; }
.salebar { cursor: pointer; overflow: hidden; padding-inline: 0; text-align: left; }
.salebar .track { display: flex; width: max-content; animation: salemove 24s linear infinite; }
.salebar .track span { padding-inline: 28px; white-space: nowrap; }
.salebar:hover .track { animation-play-state: paused; }
@keyframes salemove { from { transform: translateX(-50%); } to { transform: translateX(0); } }
@media (prefers-reduced-motion: reduce) { .salebar { text-align: center; } .salebar .track { animation: none; width: auto; justify-content: center; } .salebar .track span:not(:first-child) { display: none; } }
.salebar a { color: inherit; text-decoration: underline; }
.wrap { max-width: 960px; margin-inline: auto; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; letter-spacing: -0.01em; }
.social { display: flex; gap: 16px; flex-wrap: wrap; }
.social a { font-weight: 500; text-decoration: none; }
.social a:hover { text-decoration: underline; }

.hero { padding-block: clamp(40px, 8vw, 80px) clamp(32px, 6vw, 56px); }
.hero h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(2.4rem, 7vw, 4.4rem); line-height: 1.02; letter-spacing: -0.03em; max-width: 14ch; text-wrap: balance; margin: 0; }
.hero p { max-width: 52ch; margin: 20px 0 0; color: var(--muted); font-size: 1.125rem; }
.hero .cta { display: inline-block; margin-top: 28px; }

.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 10px 20px; border-radius: 6px; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-family: var(--font-body); font-weight: 500; font-size: 1rem; text-decoration: none; cursor: pointer; }
.btn:hover { filter: brightness(1.08); }
.btn:disabled, .btn[aria-disabled="true"] { background: transparent; color: var(--muted); border-color: var(--line); cursor: not-allowed; filter: none; }

h2 { font-family: var(--font-display); font-size: 1.6rem; letter-spacing: -0.02em; margin: 0 0 20px; }
section { padding-block: 32px; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.filters button { min-height: 36px; padding: 4px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; font-size: 0.9rem; cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.catalog { display: flex; flex-direction: column; gap: 16px; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px 32px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 24px; align-items: start; }
.item[hidden] { display: none !important; }
.file { display: inline-block; font-family: var(--font-mono); font-size: 0.8rem; background: var(--chip); color: var(--fg); padding: 3px 8px; border-radius: 4px; margin-bottom: 10px; }
.item h3 { font-family: var(--font-display); font-size: 1.5rem; letter-spacing: -0.02em; margin: 0 0 6px; }
.item p { margin: 0 0 12px; color: var(--muted); max-width: 60ch; }
.item ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 0.95rem; }
.item li { padding-left: 20px; position: relative; min-width: 0; }
.item li::before { content: ""; position: absolute; left: 2px; top: 0.6em; width: 8px; height: 2px; background: var(--accent); }
.buy { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; min-width: 150px; }
.price { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; letter-spacing: -0.02em; }
.price.soon { font-size: 1rem; font-weight: 500; color: var(--muted); font-family: var(--font-body); letter-spacing: 0; }

.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; padding: 0; margin: 0; list-style: none; counter-reset: step; }
.steps li { counter-increment: step; border-top: 2px solid var(--fg); padding-top: 12px; min-width: 0; }
.steps li::before { content: counter(step); display: block; font-family: var(--font-mono); font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
.steps strong { display: block; font-family: var(--font-display); font-size: 1.15rem; margin-bottom: 2px; }
.steps span { color: var(--muted); }

.about p { max-width: 62ch; margin: 0 0 12px; }
.contact { font-family: var(--font-mono); font-size: 0.95rem; user-select: all; }

.faq { display: grid; gap: 8px; max-width: 62ch; }
.faq details { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.faq summary { list-style: none; cursor: pointer; padding: 10px 16px; min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 16px; font-weight: 500; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; font-family: var(--font-mono); font-size: 1.25rem; color: var(--accent); flex: none; }
.faq details[open] summary::after { content: "\2212"; }
.faq .ans { margin: 0; padding: 0 16px 14px; color: var(--muted); }

footer { border-top: 1px solid var(--line); padding-top: 20px; margin-top: 16px; color: var(--muted); font-size: 0.875rem; display: grid; gap: 4px; }

.price-box { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.now-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.was { color: var(--muted); font-size: 1rem; }
.badge { font-family: var(--font-mono); font-size: 0.8rem; font-weight: 500; background: var(--accent); color: var(--accent-ink); padding: 2px 8px; border-radius: 999px; }
.launch { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.ends { font-size: 0.85rem; color: var(--muted); }

@media (max-width: 640px) {
  .price-box { align-items: flex-start; }
  .now-row { justify-content: flex-start; }
  .item { grid-template-columns: minmax(0, 1fr); padding: 20px; }
  .buy { flex-direction: row; align-items: center; justify-content: space-between; min-width: 0; flex-wrap: wrap; }
}
@media (prefers-reduced-motion: no-preference) {
  html { scroll-behavior: smooth; }
  .hero h1, .hero p, .hero .cta { animation: rise 0.6s ease both; }
  .hero p { animation-delay: 0.08s; }
  .hero .cta { animation-delay: 0.16s; }
  .item { animation: rise 0.5s ease both; transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease; }
  .item:nth-child(2) { animation-delay: 0.08s; }
  @media (hover: hover) {
    .item:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 10px 28px var(--shadow); }
  }
  .faq details[open] .ans { animation: rise 0.3s ease both; }
  .badge { animation: pop 0.5s 0.35s ease both; }
  .steps li { animation: rise 0.5s ease both; }
  .steps li:nth-child(2) { animation-delay: 0.08s; }
  .steps li:nth-child(3) { animation-delay: 0.16s; }
  .btn { transition: filter 0.15s ease, transform 0.1s ease; }
  .btn:not([aria-disabled="true"]):active { transform: scale(0.97); }
  .filters button { transition: background 0.15s ease, color 0.15s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes pop { 0% { opacity: 0; transform: scale(0.6); } 70% { opacity: 1; transform: scale(1.12); } 100% { opacity: 1; transform: scale(1); } }
}


.head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 10px; }
.head .file { margin-bottom: 0; }
.sprite { width: 64px; height: auto; flex: none; shape-rendering: crispEdges; image-rendering: pixelated; animation: spritebob 1.2s steps(1, end) infinite; }
@keyframes spritebob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@media (prefers-reduced-motion: reduce) { .sprite { animation: none; } }

.crew-note { color: var(--muted); max-width: 60ch; margin: -8px 0 20px; }
.crew { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .crew { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.mate { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 10px 10px; text-align: center; transition: border-color .25s ease, transform .25s ease; min-width: 0; }
.mate .sprite { width: 52px; margin: 0 auto 6px; display: block; animation: none; opacity: .55; transition: opacity .25s ease; }
.mate .nm { font-family: var(--font-display); font-weight: 700; font-size: .95rem; line-height: 1.2; }
.mate .st { font-family: var(--font-mono); font-size: .72rem; color: var(--muted); margin-top: 4px; min-height: 1.1em; }
.mate.working { border-color: var(--accent); transform: translateY(-3px); }
.mate.working .sprite { opacity: 1; animation: spritebob .5s steps(1, end) infinite; }
.mate.working .st { color: var(--accent); }
.mate.done .sprite { opacity: 1; animation: none; }
.mate.done .st { color: var(--fg); }
.crew-ctrl { display: flex; align-items: center; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
.crew-ctrl button { min-height: 40px; padding: 8px 16px; border-radius: 6px; border: 2px solid var(--accent); background: transparent; color: var(--fg); font: 500 .95rem var(--font-body); cursor: pointer; }
.crew-ctrl button:hover { background: var(--chip); }
.crew-ctrl .wave { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .mate, .mate .sprite { transition: none; } .mate.working { transform: none; } .mate.working .sprite { animation: none; } }

:root { --accent-hi: #E0701F; --accent-lo: #8F3608; --glow: rgba(232, 99, 26, 0.18); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --accent-hi: #FFB27A; --accent-lo: #B8541C; --glow: rgba(242, 139, 80, 0.16); } }
:root[data-theme="dark"] { --accent-hi: #FFB27A; --accent-lo: #B8541C; --glow: rgba(242, 139, 80, 0.16); }
.hero { position: relative; }
.hero::before { content: ""; position: absolute; z-index: -1; left: -10%; top: -20%; width: 70%; height: 120%; background: radial-gradient(closest-side, var(--glow), transparent 70%); pointer-events: none; }
.btn:not(:disabled):not([aria-disabled="true"]) { background: linear-gradient(180deg, var(--accent-hi), var(--accent)); border-color: var(--accent-lo); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 3px 0 var(--accent-lo), 0 8px 14px -6px rgba(0,0,0,.35); transition: transform .12s ease, box-shadow .12s ease; }
.btn:not(:disabled):not([aria-disabled="true"]):hover { transform: translateY(-1px); filter: none; }
.btn:not(:disabled):not([aria-disabled="true"]):active { transform: translateY(3px); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 0 0 var(--accent-lo); }
.badge { background: linear-gradient(180deg, var(--accent-hi), var(--accent)); box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 2px 0 var(--accent-lo); }
.item { box-shadow: 0 1px 0 var(--line), 0 14px 26px -16px rgba(38, 28, 21, .45); transition: transform .2s ease, box-shadow .2s ease; }
.item:hover { transform: translateY(-3px); box-shadow: 0 1px 0 var(--line), 0 22px 34px -16px rgba(38, 28, 21, .5); }
.sprite { filter: drop-shadow(0 3px 0 rgba(0,0,0,.16)) drop-shadow(0 8px 5px rgba(0,0,0,.2)); }
.how-art { display: flex; align-items: center; justify-content: center; gap: clamp(6px, 2vw, 18px); padding: clamp(16px, 3vw, 28px); margin: 0 0 24px; background: linear-gradient(180deg, var(--surface), var(--chip)); border: 1px solid var(--line); border-radius: 14px; box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 18px 30px -20px rgba(38,28,21,.5); }
.how-art svg { display: block; flex: 0 1 190px; width: 100%; max-width: 190px; height: auto; shape-rendering: crispEdges; filter: drop-shadow(0 3px 0 rgba(0,0,0,.14)) drop-shadow(0 10px 6px rgba(0,0,0,.18)); animation: spritebob 1.6s steps(1, end) infinite; }
.how-art svg:nth-of-type(2) { animation-delay: -.5s; }
.how-art svg:nth-of-type(3) { animation-delay: -1s; }
.how-art svg.arrow { flex: 0 0 clamp(20px, 5vw, 36px); max-width: 36px; filter: none; animation: arrowpulse 1.2s steps(1, end) infinite; }
@keyframes arrowpulse { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(3px); } }
@media (prefers-reduced-motion: reduce) { .how-art svg, .how-art svg.arrow { animation: none; } .item, .item:hover { transition: none; transform: none; } .btn { transition: none; } }

.salebar { padding: 0; background: linear-gradient(180deg, var(--accent-hi), var(--accent)); border-bottom: 3px solid var(--accent-lo); box-shadow: 0 6px 16px -6px rgba(0,0,0,.45); font-size: 0.92rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; position: sticky; }
.salebar::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 35%, rgba(255,255,255,.38) 50%, transparent 65%); transform: translateX(-120%); animation: saleshine 4.5s ease-in-out infinite; pointer-events: none; }
@keyframes saleshine { 0%, 55% { transform: translateX(-120%); } 85%, 100% { transform: translateX(120%); } }
.salebar .track span { display: inline-flex; align-items: center; gap: 10px; padding: 12px 22px; }
.salebar .tag { width: 22px; height: 18px; flex: none; shape-rendering: crispEdges; filter: drop-shadow(0 2px 0 rgba(0,0,0,.25)); }
.salebar .pct { background: var(--accent-ink); color: var(--accent); padding: 2px 8px; border-radius: 999px; box-shadow: 0 2px 0 rgba(0,0,0,.25); }
@media (prefers-reduced-motion: reduce) { .salebar::after { animation: none; display: none; } }
</style>

<body>


<!--
  AKO PRIDAŤ NOVÝ SKILL
  1. Nižšie v poli PRODUCTS skopíruj jeden blok { ... } a uprav ho.
  2. V Stripe vytvor platobný odkaz a vlož ho do stripeUrl. Kým je stripeUrl prázdne, tlačidlo ukazuje "Coming soon".
  3. price je cena, ktorú zákazník naozaj zaplatí (číslo, napr. 35). regularPrice je vyššia cena, ktorú budeš naozaj účtovať po skončení akcie.
     Ak je regularPrice vyplnená, stránka ukáže prečiarknutú cenu a % zľavy sama. Ak ju zmažeš, zľava zmizne.
     offerEnds je text typu "31 October". Vyplň ho len ak sa cena v ten deň naozaj zvýši, inak ho nechaj prázdny.
     Pozor: prečiarknutá cena musí byť pravdivá. V EÚ je zavádzajúca zľava z vymyslenej ceny nezákonná.
  Polia o tebe (meno, texty, Instagram, TikTok, kontakt, firemné údaje) sú v PROFILE. Prázdne polia sa na stránke nezobrazia.
-->

<div class="salebar" id="salebar" role="link" tabindex="0" aria-label="Launch sale, ends soon. See the skills" hidden><div class="track" id="saletrack"></div></div>

<div class="wrap">
  <header class="top">
    <div class="brand" id="brand"></div>
    <nav class="social" id="social" aria-label="Social media"></nav>
  </header>

  <div class="hero">
    <h1 id="headline"></h1>
    <p id="tagline"></p>
    <a class="btn cta" href="#skilly">Choose a skill</a>
  </div>

  <section id="skilly" aria-labelledby="h-skilly">
    <h2 id="h-skilly">Skills</h2>
    <div class="filters" id="filters" hidden></div>
    <div class="catalog" id="catalog"></div>
  </section>

  <section aria-labelledby="h-how">
    <h2 id="h-how">How it works</h2>
    <figure class="how-art" id="how-art" aria-hidden="true"></figure>
    <ol class="steps">
      <li><strong>Pick a skill</strong><span>Read what it does and hit Buy.</span></li>
      <li><strong>Pay with Stripe</strong><span>Card payment on Stripe's secure checkout.</span></li>
      <li><strong>Add it to Claude</strong><span>You get a download page right after paying, with the file and the exact steps.</span></li>
    </ol>
  </section>

  <section aria-labelledby="h-faq">
    <h2 id="h-faq">Questions</h2>
    <div class="faq" id="faq"></div>
  </section>

  <section class="about" id="about" aria-labelledby="h-about" hidden>
    <h2 id="h-about">About me</h2>
    <div id="about-text"></div>
    <p class="contact" id="contact" hidden></p>
  </section>

  <footer id="footer"></footer>
</div>

function el(tag, attrs, children) {

  if (attrs) for (const k in attrs) {

  }
  (children || []).forEach(function (c) { node.appendChild(c); });
  return node;
}

const SPRITES = {
  "clients": ["..Y..Y..Y..", "..YYYYYYY..", ".BBBBBBBBB.", ".BBBBBBBBB.", ".BWDBBBWDB.", ".BBBBBBBBB.", ".BBBDDDBBB.", ".BBBBBBBBB.", "..BBBBBBB..", "..BB...BB..", "..DD...DD.."],

/* Shaded pixel renderer: light edge on top and left, darker edge on bottom and right, plus a glossy spot. */

/* How-it-works picture: pick a skill, pay, add it to Claude. */
(function () {

  function grid(w, h) { const g = []; for (let y = 0; y < h; y++) g.push(new Array(w).fill(".")); return g; }

  fill(a, 8, 5, 6, 2, "Y"); fill(a, 3, 9, 7, 1, "D"); fill(a, 3, 11, 5, 1, "D"); fill(a, 11, 9, 4, 3, "Y"); fill(a, 12, 10, 2, 1, "D");

  fill(b, 1, 3, 16, 10, "D"); fill(b, 2, 4, 14, 8, "K"); fill(b, 2, 6, 14, 2, "D"); fill(b, 3, 9, 3, 2, "Y"); fill(b, 8, 10, 6, 1, "W"); fill(b, 14, 2, 3, 3, "G"); fill(b, 15, 1, 1, 1, "G");

let spriteCount = 0;
function renderItem(p) {
  if (p.regularPrice && p.price && new Date() > OFFER_END) { p = Object.assign({}, p, { price: p.regularPrice, regularPrice: null }); }
  const buy = el("div", { "class": "buy" });
  const box = el("div", { "class": "price-box" });
  if (p.price) {
    if (p.regularPrice && p.regularPrice > p.price) {
      const pct = Math.round((1 - p.price / p.regularPrice) * 100);
      box.appendChild(el("div", { "class": "launch", text: "Launch price" }));
      box.appendChild(el("div", { "class": "now-row" }, [
        el("s", { "class": "was", text: CURRENCY + p.regularPrice }),
        el("span", { "class": "price", text: CURRENCY + p.price }),
        el("span", { "class": "badge", text: "-" + pct + "%" })
      ]));
      const daysLeft = (OFFER_END - new Date()) / 86400000;
      box.appendChild(el("div", { "class": "ends", text: daysLeft <= 30 ? "Ends soon" : "Ends this year" }));
    } else {
      box.appendChild(el("div", { "class": "price", text: CURRENCY + p.price }));
    }
  } else {
    box.appendChild(el("div", { "class": "price soon", text: "Price coming soon" }));
  }
  buy.appendChild(box);
  if (p.stripeUrl) {
    buy.appendChild(el("a", { "class": "btn", href: p.stripeUrl, target: "_blank", rel: "noopener noreferrer", text: "Buy" }));
  } else {
    buy.appendChild(el("button", { "class": "btn", type: "button", disabled: "", text: "Coming soon" }));
  }
  const list = el("ul");
  (p.features || []).forEach(function (f) { list.appendChild(el("li", { text: f })); });
  const spr = makeSprite(p.id, spriteCount++);
  const headKids = [el("span", { "class": "file", text: p.file })];
  if (spr) headKids.unshift(spr);
  const info = el("div", null, [
    el("div", { "class": "head" }, headKids),
    el("h3", { text: p.name }),
    el("p", { text: p.description }),
    list
  ]);
  const item = el("article", { "class": "item", "data-tag": p.tag || "" }, [info, buy]);
  return item;
}
