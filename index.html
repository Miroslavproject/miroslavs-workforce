<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="description" content="Skills for Claude that work as a team. Clients, Clone, Site Builder and Clothes Designer by Miroslavs Workforce.">
<title>Miroslavs Workforce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="salebar" id="salebar" role="link" tabindex="0" aria-label="Launch sale, ends soon. See the skills" hidden><div class="track" id="saletrack"></div></div>

<div class="wrap">
  <header class="top">
    <div class="brand" id="brand"></div>
    <nav class="social" id="social" aria-label="Social media"></nav>
  </header>

  <div class="hero">
    <h1 id="headline"></h1>
    <p id="tagline"></p>
    <a class="btn cta" href="#skilly">Choose a skill</a>
  </div>

  <section id="skilly" aria-labelledby="h-skilly">
    <h2 id="h-skilly">Skills</h2>
    <div class="filters" id="filters" hidden></div>
    <div class="catalog" id="catalog"></div>
  </section>

  <section aria-labelledby="h-how">
    <h2 id="h-how">How it works</h2>
    <figure class="how-art" id="how-art" aria-hidden="true"></figure>
    <ol class="steps">
      <li><strong>Pick a skill</strong><span>Read what it does and hit Buy.</span></li>
      <li><strong>Pay with Stripe</strong><span>Card payment on Stripe's secure checkout.</span></li>
      <li><strong>Add it to Claude</strong><span>You get a download page right after paying, with the file and the exact steps.</span></li>
    </ol>
  </section>

  <section aria-labelledby="h-faq">
    <h2 id="h-faq">Questions</h2>
    <div class="faq" id="faq"></div>
  </section>

  <section class="about" id="about" aria-labelledby="h-about" hidden>
    <h2 id="h-about">About me</h2>
    <div id="about-text"></div>
    <p class="contact" id="contact" hidden></p>
  </section>

  <footer id="footer"></footer>
</div>


<noscript><p>Please enable JavaScript to see the skills catalog.</p></noscript>
<script src="app.js" defer></script>
</body>
</html>
